[project]
name = "nai-cli"
version = "0.2.0"
description = "Command-line client for NovelAI image generation"
dynamic = ["readme"]
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
keywords = ["novelai", "cli", "image-generation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "httpx>=0.27",
    # load_default with a size, the watermark's built-in font
    "pillow>=10.1",
    "numpy>=1.26",
    "regex>=2024.11.6",
    "argon2-cffi>=23.1",
]

[project.urls]
Homepage = "https://github.com/obzawa/nai-cli"
Repository = "https://github.com/obzawa/nai-cli"
Documentation = "https://github.com/obzawa/nai-cli/blob/main/docs/usage.md"
Changelog = "https://github.com/obzawa/nai-cli/blob/main/CHANGELOG.md"
Issues = "https://github.com/obzawa/nai-cli/issues"

[project.scripts]
nai = "nai_cli.cli:main"

[project.optional-dependencies]
# Taggers and SAM run on this computer
local = ["onnxruntime>=1.17"]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=24"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
# Relative links do not resolve on PyPI; point them at the released tag
pattern = '\]\((?!https?://|#)([^)]+)\)'
replacement = '](https://github.com/obzawa/nai-cli/blob/v$HFPR_VERSION/\1)'

[tool.hatch.build.targets.sdist]
# Hatch skips only what .gitignore lists; untracked files of a working copy stay out this way
only-include = [
    "src",
    "tests",
    "docs",
    "skills",
    "CHANGELOG.md",
    "LICENSE",
    "README.md",
    "README.zh.md",
    "THIRD_PARTY_NOTICES.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nai_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = ["E501"]
# Full-width punctuation, curly quotes and the multiplication sign are prompt syntax handled on purpose
allowed-confusables = ["，", "（", "）", "：", "；", "‘", "’", "×"]

[tool.ruff.lint.flake8-comprehensions]
allow-dict-calls-with-keyword-arguments = true
